<meta charset="utf-8">
<title>Ogis Creatives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a full-screen macOS Tahoe-style desktop — transparent menu bar, right-hand icon column, floating Liquid Glass dock, draggable glass windows. */
:root {
  --text: #1b1e27; --text-2: #5d6372; --text-3: #8b909d;
  --win-bg: rgba(246,247,251,.80); --win-solid: #fbfbfd; --win-line: rgba(20,30,60,.15);
  --glass: rgba(255,255,255,.42); --glass-edge: rgba(255,255,255,.7); --glass-hi: rgba(255,255,255,.85);
  --side-bg: rgba(255,255,255,.55); --menu-bg: rgba(244,246,252,.74); --dock-bg: rgba(255,255,255,.26);
  --cap-bg: rgba(255,255,255,.75); --paper: #ffffff; --term-bg: rgba(22,24,31,.92); --term-fg: #dfe5ee;
  --accent: #2a7cf7; --accent-text: #ffffff; --sel: rgba(42,124,247,.16); --hover: rgba(20,30,60,.06);
  --light-off: rgba(20,30,60,.16); --dot: rgba(10,20,40,.7);
  --w0: #a9dcff; --w1: #3f8de9; --w2: #0e3a9a; --b1: #8af3e8; --b2: #ffffff; --b3: #2741c9;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --text: #eef0f6; --text-2: #a6acbb; --text-3: #7b8191;
  --win-bg: rgba(30,32,42,.78); --win-solid: #1c1e26; --win-line: rgba(255,255,255,.12);
  --glass: rgba(40,44,58,.42); --glass-edge: rgba(255,255,255,.17); --glass-hi: rgba(255,255,255,.14);
  --side-bg: rgba(255,255,255,.06); --menu-bg: rgba(34,36,48,.74); --dock-bg: rgba(28,32,46,.34);
  --cap-bg: rgba(255,255,255,.09); --paper: #24262f; --term-bg: rgba(14,15,20,.92); --term-fg: #dfe5ee;
  --accent: #3d8bff; --sel: rgba(61,139,255,.26); --hover: rgba(255,255,255,.07);
  --light-off: rgba(255,255,255,.18); --dot: rgba(255,255,255,.8);
  --w0: #2c4479; --w1: #142659; --w2: #040a1e; --b1: #2d8fae; --b2: #6f8fd6; --b3: #1a1f6e;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --text: #eef0f6; --text-2: #a6acbb; --text-3: #7b8191;
  --win-bg: rgba(30,32,42,.78); --win-solid: #1c1e26; --win-line: rgba(255,255,255,.12);
  --glass: rgba(40,44,58,.42); --glass-edge: rgba(255,255,255,.17); --glass-hi: rgba(255,255,255,.14);
  --side-bg: rgba(255,255,255,.06); --menu-bg: rgba(34,36,48,.74); --dock-bg: rgba(28,32,46,.34);
  --cap-bg: rgba(255,255,255,.09); --paper: #24262f; --term-bg: rgba(14,15,20,.92); --term-fg: #dfe5ee;
  --accent: #3d8bff; --sel: rgba(61,139,255,.26); --hover: rgba(255,255,255,.07);
  --light-off: rgba(255,255,255,.18); --dot: rgba(255,255,255,.8);
  --w0: #2c4479; --w1: #142659; --w2: #040a1e; --b1: #2d8fae; --b2: #6f8fd6; --b3: #1a1f6e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; font: 13px/1.45 var(--font); color: var(--text); background: var(--w2);
  -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Wallpaper ---------- */
.wall { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(170deg, var(--w0) 0%, var(--w1) 46%, var(--w2) 100%); transition: filter .6s; }
.wall[data-v="dusk"] { --w0: #ffc9a6; --w1: #c55ea6; --w2: #261a66; --b1: #ffd27a; --b2: #ffe6f2; --b3: #4a1e8f; }
.wall[data-v="lake"] { --w0: #c7f4e6; --w1: #2fa59a; --w2: #0b3e57; --b1: #d6fff3; --b2: #ffffff; --b3: #0f5f7a; }
.wall[data-v="night"] { --w0: #2c4479; --w1: #142659; --w2: #040a1e; --b1: #2d8fae; --b2: #6f8fd6; --b3: #1a1f6e; }
.wall i { position: absolute; border-radius: 50%; filter: blur(50px); animation: drift 26s ease-in-out infinite alternate; }
.wall .b1 { width: 80vmax; height: 38vmax; left: -20vmax; top: 34%; background: radial-gradient(closest-side, var(--b1), transparent); opacity: .65; }
.wall .b2 { width: 50vmax; height: 30vmax; right: -12vmax; top: -10vmax; background: radial-gradient(closest-side, var(--b2), transparent); opacity: .55; animation-duration: 32s; }
.wall .b3 { width: 90vmax; height: 40vmax; right: -30vmax; bottom: -22vmax; background: radial-gradient(closest-side, var(--b3), transparent); opacity: .8; animation-duration: 40s; }
.wall svg { position: absolute; inset: 0; width: 100%; height: 100%; }
@keyframes drift { to { transform: translate(4vmax, -3vmax) scale(1.08); } }
body.locked .wall { filter: blur(0); }

/* ---------- Menu bar ---------- */
.menubar { position: fixed; top: 0; left: 0; right: 0; z-index: 9000; height: calc(30px + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 1px; color: #fff; text-shadow: 0 1px 2px rgba(0,10,40,.3); transition: opacity .4s; }
.mb-item { height: 24px; padding: 0 9px; display: flex; align-items: center; gap: 6px; border-radius: 8px; border: 0; background: none; color: inherit; cursor: default; white-space: nowrap; }
.mb-item:hover, .mb-item.open { background: rgba(255,255,255,.22); }
.mb-item.bold { font-weight: 700; }
.mb-logo svg { width: 16px; height: 16px; filter: drop-shadow(0 1px 1px rgba(0,10,40,.3)); }
.mb-spacer { flex: 1; }
.mb-item svg.ico { width: 17px; height: 17px; }
.mb-clock { font-variant-numeric: tabular-nums; }

.menu { position: fixed; z-index: 9600; min-width: 230px; padding: 5px; border-radius: 14px; color: var(--text);
  background: var(--menu-bg); -webkit-backdrop-filter: blur(30px) saturate(1.9); backdrop-filter: blur(30px) saturate(1.9);
  box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 0 0 .5px var(--win-line), 0 14px 40px rgba(0,10,40,.28); text-shadow: none; }
.menu button { display: flex; width: 100%; justify-content: space-between; gap: 24px; padding: 4px 10px; border: 0; border-radius: 8px; background: none; text-align: left; cursor: default; }
.menu button:hover:not(:disabled) { background: var(--accent); color: var(--accent-text); }
.menu button:disabled { color: var(--text-3); }
.menu kbd { font: inherit; color: var(--text-3); }
.menu button:hover:not(:disabled) kbd { color: inherit; opacity: .8; }
.menu hr { border: 0; height: 1px; background: var(--win-line); margin: 5px 10px; }

/* ---------- Desktop icons ---------- */
.icons { position: fixed; top: 42px; right: max(14px, env(safe-area-inset-right, 0px)); bottom: 108px; display: grid; direction: rtl;
  grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 96px); grid-auto-columns: 92px; gap: 2px 4px; z-index: 1; transition: opacity .4s; }
.dicon { direction: ltr; width: 92px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 2px; border: 0; background: none; cursor: default; }
.dicon .img { width: 60px; height: 56px; display: grid; place-items: center; border-radius: 10px; padding: 3px; }
.dicon .img > * { max-width: 100%; max-height: 100%; }
.dicon .img .app-icon { width: 48px; height: 48px; }
.dicon span { color: #fff; font-size: 12px; font-weight: 500; line-height: 1.25; text-align: center; padding: 1px 5px; border-radius: 5px; text-shadow: 0 1px 3px rgba(0,10,40,.55); }
.dicon.sel .img { background: rgba(0,10,40,.2); }
.dicon.sel span { background: var(--accent); color: var(--accent-text); text-shadow: none; }

/* ---------- Icons ---------- */
.app-icon { position: relative; display: grid; place-items: center; border-radius: 23%; overflow: hidden; box-shadow: 0 2px 6px rgba(0,10,40,.22); }
.app-icon::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,0) 42%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.38), inset 0 -1px 3px rgba(0,0,0,.14); }
.app-icon svg { width: 62%; height: 62%; position: relative; }
.app-icon .letter { position: relative; color: #fff; font: 700 1.6em/1 var(--font-display); text-shadow: 0 1px 2px rgba(0,0,0,.2); }
.ai-finder { background: linear-gradient(90deg, #e6f5ff 0 50%, #2f8cff 50%); }
.ai-finder svg { width: 100%; height: 100%; }
.ai-about { background: linear-gradient(160deg, #c9925e, #8a5a34); }
.ai-photos { background: linear-gradient(160deg, #ffffff, #eef0f4); }
.ai-notes { background: linear-gradient(180deg, #ffd448 0 27%, #fffcf2 27%); }
.ai-terminal { background: linear-gradient(160deg, #3a3f4b, #16181e); }
.ai-mail { background: linear-gradient(180deg, #5bcbff, #1d6cf0); }
.ai-trash { background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(220,228,240,.45)); }
.ai-site { background: linear-gradient(160deg, #6ec3ff, #3b4fd8 60%, #1b1f6b); }
.ai-settings { background: linear-gradient(160deg, #c4c9d2, #7d8592); }
.thumb { width: 52px; height: 40px; border-radius: 4px; border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0,10,40,.3); background-size: cover; }

/* ---------- Dock ---------- */
.dock-wrap { position: fixed; left: 0; right: 0; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 8000; display: flex; justify-content: center; pointer-events: none; transition: opacity .4s, transform .4s; padding-inline: max(8px, env(safe-area-inset-left, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
.dock { pointer-events: auto; height: 72px; display: flex; align-items: flex-end; gap: 6px; padding: 8px 9px; border-radius: 28px;
  background: var(--dock-bg); -webkit-backdrop-filter: blur(22px) saturate(1.9); backdrop-filter: blur(22px) saturate(1.9);
  box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 0 0 1px var(--glass-edge), 0 12px 40px rgba(0,10,50,.28); }
.dock-item { position: relative; width: 54px; height: 54px; flex: none; border: 0; padding: 0; background: none; display: flex; align-items: flex-end; justify-content: center; transition: width .14s ease-out, height .14s ease-out; cursor: default; }
.dock-item .app-icon { width: 100%; height: 100%; }
.dock-item.running::after { content: ""; position: absolute; bottom: -6px; width: 4px; height: 4px; border-radius: 50%; background: var(--dot); }
.dock-item .tip { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); padding: 3px 10px; border-radius: 8px; white-space: nowrap; font-size: 12px; color: var(--text);
  background: var(--menu-bg); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 4px 14px rgba(0,10,40,.2); opacity: 0; pointer-events: none; transition: opacity .12s; }
.dock-item:hover .tip { opacity: 1; }
.dock-item.bounce .app-icon { animation: bounce .55s ease 2; }
@keyframes bounce { 40% { transform: translateY(-16px); } }
.dock-sep { width: 1px; align-self: stretch; margin: 4px 3px; background: var(--win-line); }

/* ---------- Windows ---------- */
.win { position: absolute; display: flex; flex-direction: column; min-width: 300px; min-height: 180px; border-radius: 24px; overflow: hidden;
  background: var(--win-bg); -webkit-backdrop-filter: blur(40px) saturate(1.7); backdrop-filter: blur(40px) saturate(1.7);
  box-shadow: 0 0 0 .5px var(--win-line), inset 0 1px 0 var(--glass-hi), 0 24px 70px rgba(0,10,40,.34), 0 4px 14px rgba(0,10,40,.12);
  transition: opacity .2s, transform .28s cubic-bezier(.2,.85,.25,1), box-shadow .2s; }
.win.inactive { box-shadow: 0 0 0 .5px var(--win-line), inset 0 1px 0 var(--glass-hi), 0 12px 36px rgba(0,10,40,.2); }
.win.opening { opacity: 0; transform: scale(.93) translateY(10px); }
.win.closing { opacity: 0; transform: scale(.95); }
.win.anim { transition: left .3s cubic-bezier(.2,.85,.25,1), top .3s cubic-bezier(.2,.85,.25,1), width .3s cubic-bezier(.2,.85,.25,1), height .3s cubic-bezier(.2,.85,.25,1), opacity .3s, transform .3s; }
.titlebar { flex: none; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; }
.lights { display: flex; gap: 8px; flex: none; }
.lights button { width: 13px; height: 13px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; font-size: 9px; line-height: 1; font-weight: 800; color: transparent; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.14); }
.lights .c { background: #ff5f57; } .lights .m { background: #febc2e; } .lights .x { background: #28c840; }
.lights:hover button { color: rgba(0,0,0,.55); }
.win.inactive .lights button { background: var(--light-off); }
.win-title { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; text-align: center; padding-right: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win.inactive .win-title, .win.inactive .tb-title { color: var(--text-3); }
.tb { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.tb-title { font-weight: 700; font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win-body { flex: 1; min-height: 0; overflow: auto; position: relative; }
.rs { position: absolute; right: 0; bottom: 0; width: 20px; height: 20px; cursor: nwse-resize; z-index: 3; }

.cap { display: flex; flex: none; padding: 2px; border-radius: 999px; background: var(--cap-bg); box-shadow: inset 0 0 0 .5px var(--win-line), inset 0 1px 0 var(--glass-hi), 0 1px 4px rgba(0,10,40,.08); }
.cap button { width: 32px; height: 28px; border: 0; border-radius: 999px; background: none; display: grid; place-items: center; cursor: default; }
.cap button:hover:not(:disabled) { background: var(--hover); }
.cap button:disabled { opacity: .35; }
.cap button.on { background: var(--hover); }
.cap svg { width: 15px; height: 15px; }
.search { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--cap-bg); color: var(--text-3);
  box-shadow: inset 0 0 0 .5px var(--win-line), inset 0 1px 0 var(--glass-hi); width: 150px; flex: none; }
.search input { border: 0; background: none; outline: none; width: 100%; font: inherit; color: var(--text); }
.search svg { width: 13px; height: 13px; flex: none; }

/* Finder */
.finder { display: flex; height: 100%; gap: 0; }
.sidebar { flex: none; width: 184px; margin: 0 0 10px 10px; padding: 10px 8px; border-radius: 18px; overflow: auto;
  background: var(--side-bg); box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 2px 10px rgba(0,10,40,.06); }
.sidebar h6 { margin: 8px 8px 4px; font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .02em; }
.sidebar button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border: 0; border-radius: 9px; background: none; text-align: left; cursor: default; }
.sidebar button:hover { background: var(--hover); }
.sidebar button.on { background: var(--sel); }
.sidebar button svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
.sidebar .tag { width: 10px; height: 10px; border-radius: 50%; margin: 0 3px; flex: none; }
.f-main { flex: 1; min-width: 0; overflow: auto; padding: 4px 14px 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; align-content: start; }
.item { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 4px; border: 0; background: none; border-radius: 12px; cursor: default; }
.item .img { height: 58px; display: grid; place-items: center; padding: 3px; border-radius: 9px; }
.item .img .app-icon { width: 50px; height: 50px; }
.item .img .thumb { width: 64px; height: 48px; }
.item span { font-size: 12px; text-align: center; line-height: 1.25; padding: 1px 5px; border-radius: 5px; word-break: break-word; }
.item.sel .img { background: var(--hover); }
.item.sel span { background: var(--accent); color: var(--accent-text); }
.f-status { padding: 0 2px 10px; color: var(--text-3); font-size: 12px; }
.empty { color: var(--text-3); padding: 40px 0; text-align: center; }

/* Content windows */
.pad { padding: 4px 28px 28px; }
.about { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 6px 28px 28px; -webkit-user-select: text; user-select: text; }
.avatar { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 600 34px/1 var(--font-display);
  background: linear-gradient(150deg, #7fd4ff, #3b6ef0 55%, #6a3ad6); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 6px 20px rgba(30,60,160,.3); }
.about h1 { margin: 10px 0 0; font: 700 26px/1.15 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.sub { margin: 0; color: var(--text-2); }
.bio { max-width: 52ch; color: var(--text-2); margin: 8px 0 4px; }
.specs { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 10px 0 6px; text-align: left; font-size: 12.5px; }
.specs dt { color: var(--text-3); text-align: right; font-weight: 500; }
.specs dd { margin: 0; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 30px; padding: 0 16px; border: 0; border-radius: 999px; text-decoration: none; cursor: default;
  background: var(--cap-bg); color: var(--text); box-shadow: inset 0 0 0 .5px var(--win-line), inset 0 1px 0 var(--glass-hi), 0 1px 3px rgba(0,10,40,.1); font-weight: 500; }
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--accent); color: var(--accent-text); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 2px 8px rgba(42,124,247,.35); }
.logo-big { width: 104px; height: 104px; border-radius: 26px; }
.logo-big svg { width: 60%; height: 60%; }

.proj-hero { height: 150px; display: flex; align-items: flex-end; padding: 0 28px; margin: 0 10px; border-radius: 18px; position: relative; overflow: hidden; }
.proj-hero .app-icon { width: 84px; height: 84px; transform: translateY(30px); font-size: 22px; box-shadow: 0 8px 24px rgba(0,10,40,.3); }
.proj-hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 90% at 85% 0%, rgba(255,255,255,.45), transparent 60%); }
.proj { padding: 42px 28px 28px; -webkit-user-select: text; user-select: text; }
.proj h2 { margin: 0; font: 700 24px/1.2 var(--font-display); text-wrap: balance; }
.proj .meta { color: var(--text-2); margin: 2px 0 14px; }
.proj p { max-width: 62ch; margin: 0 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; }
.chip { padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--hover); color: var(--text-2); }

.preview { display: flex; flex-direction: column; height: 100%; padding: 0 10px 10px; gap: 8px; }
.preview .pic { flex: 1; min-height: 0; border-radius: 16px; background-size: cover; background-position: center; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12); }
.preview .cap-line { display: flex; justify-content: space-between; gap: 12px; padding: 0 6px; color: var(--text-2); font-size: 12px; }

.photos { padding: 0 14px 18px; }
.photos h3 { margin: 0 2px 10px; font: 700 20px/1.2 var(--font-display); }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px; }
.pgrid button { aspect-ratio: 1; border: 0; padding: 0; border-radius: 6px; background-size: cover; background-position: center; cursor: default; max-width: 100%; }
.pgrid button:hover { filter: brightness(1.06); }

.notes { display: flex; height: 100%; }
.notes .sidebar { width: 220px; }
.note-row { flex-direction: column; align-items: flex-start !important; gap: 0 !important; }
.note-row b { font-weight: 600; }
.note-row small { color: var(--text-3); font-size: 11.5px; }
.note-body { flex: 1; min-width: 0; overflow: auto; padding: 6px 30px 30px; -webkit-user-select: text; user-select: text; }
.note-body .date { color: var(--text-3); font-size: 12px; text-align: center; margin-bottom: 14px; }
.note-body h2 { margin: 0 0 10px; font: 700 22px/1.25 var(--font-display); text-wrap: balance; }
.note-body p { max-width: 64ch; margin: 0 0 12px; font-size: 14px; line-height: 1.6; }

.paper { margin: 0 14px 14px; padding: 36px 40px; background: var(--paper); border-radius: 10px; box-shadow: 0 0 0 .5px var(--win-line), 0 4px 18px rgba(0,10,40,.1); -webkit-user-select: text; user-select: text; }
.paper h1 { margin: 0; font: 700 28px/1.1 var(--font-display); letter-spacing: -.01em; }
.paper .role { color: var(--accent); font-weight: 600; margin: 4px 0 18px; }
.paper h4 { margin: 20px 0 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
.cv-row { display: grid; grid-template-columns: 88px 1fr; gap: 12px; margin-bottom: 10px; }

  desk.appendChild(el);
  const win = { id: o.id, app: o.app, el, title: o.title, state: o.state || {} };
  WINS.set(o.id, win);
  wireWin(win);
  if (o.mount) o.mount(win);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('opening')));

}
function wireWin(win) {
  const { el } = win, bar = $('.titlebar', el);
  el.addEventListener('pointerdown', () => focusWin(win), true);
  $('.lights .c', el).onclick = () => closeWin(win);
  $('.lights .m', el).onclick = () => minimizeWin(win);
  $('.lights .x', el).onclick = () => zoomWin(win);
  bar.addEventListener('dblclick', e => { if (!e.target.closest('button,input')) zoomWin(win); });
  bar.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button,input,.cap,.search') || isPhone()) return;
    const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
    bar.setPointerCapture(e.pointerId);
    const move = ev => {
      el.style.left = Math.min(innerWidth - 80, Math.max(80 - el.offsetWidth, ox + ev.clientX - sx)) + 'px';
      el.style.top = Math.min(innerHeight - 60, Math.max(32, oy + ev.clientY - sy)) + 'px';
    };
    const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); };
    bar.addEventListener('pointermove', move); bar.addEventListener('pointerup', up);
  });
  const rs = $('.rs', el);
  rs.addEventListener('pointerdown', e => {
    e.stopPropagation(); rs.setPointerCapture(e.pointerId);
    const sx = e.clientX, sy = e.clientY, ow = el.offsetWidth, oh = el.offsetHeight;
    const move = ev => { el.style.width = Math.max(320, ow + ev.clientX - sx) + 'px'; el.style.height = Math.max(200, oh + ev.clientY - sy) + 'px'; };
    const up = () => { rs.removeEventListener('pointermove', move); rs.removeEventListener('pointerup', up); };
    rs.addEventListener('pointermove', move); rs.addEventListener('pointerup', up);
  });
}
function focusWin(win) {
  win.el.style.zIndex = ++zTop;
  WINS.forEach(w => w.el.classList.toggle('inactive', w !== win));
  setAppName(APPS[win.app]?.name || 'Finder');
}
function topWin() { let best = null; WINS.forEach(w => { if (!w.min && (!best || +w.el.style.zIndex > +best.el.style.zIndex)) best = w; }); return best; }
function refocus() { const t = topWin(); if (t) focusWin(t); else { WINS.forEach(w => w.el.classList.add('inactive')); setAppName('Finder'); } }
function closeWin(win) {
  win.el.classList.add('closing'); WINS.delete(win.id);
  setTimeout(() => win.el.remove(), 200); refocus(); renderDock();
}
function minimizeWin(win) {
  const target = $(`.dock-item[data-app="${win.app}"]`)?.getBoundingClientRect();
  const r = win.el.getBoundingClientRect();
  const dx = target ? target.left + target.width / 2 - (r.left + r.width / 2) : 0, dy = target ? target.top - r.top - r.height / 2 : innerHeight;
  win.el.style.transform = `translate(${dx}px, ${dy}px) scale(.08)`; win.el.style.opacity = '0';
  win.min = true; setTimeout(() => { if (win.min) win.el.style.visibility = 'hidden'; }, 300);
  refocus();
}
function restoreWin(win) {
  if (!win.min) return;
  win.min = false; win.el.style.visibility = ''; win.el.style.transform = ''; win.el.style.opacity = '';
}
function zoomWin(win) {
  if (isPhone()) return;
  const el = win.el; el.classList.add('anim');
  if (win.saved) { Object.assign(el.style, win.saved); win.saved = null; }
  else { win.saved = { left: el.style.left, top: el.style.top, width: el.style.width, height: el.style.height };
    Object.assign(el.style, { left: '8px', top: '36px', width: innerWidth - 16 + 'px', height: innerHeight - 36 - 98 + 'px' }); }
  setTimeout(() => el.classList.remove('anim'), 320);
}

function drawQR(c) {
  const n = 29, x = c.getContext('2d'); let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  x.fillStyle = '#fff'; x.fillRect(0, 0, n, n); x.fillStyle = '#111318';
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (rnd() > .52) x.fillRect(i, j, 1, 1);
  [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([a, b]) => { x.fillStyle = '#fff'; x.fillRect(a - 1, b - 1, 9, 9); x.fillStyle = '#111318'; x.fillRect(a, b, 7, 7); x.fillStyle = '#fff'; x.fillRect(a + 1, b + 1, 5, 5); x.fillStyle = '#111318'; x.fillRect(a + 2, b + 2, 3, 3); });
}

    body: `${VIZ[p.viz]()}<div class="proj" style="padding-top:20px"><div class="title">${projIcon(p)}<div><h2>${esc(p.name)}${p.status ? `<span class="status">${esc(p.status)}</span>` : ''}</h2><div class="meta" style="margin:0">${esc(p.kind)}</div></div></div><div class="chips" style="margin-top:14px">${p.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div><p>${esc(p.body)}</p><div class="btnrow" style="justify-content:flex-start"><button class="btn primary" data-ask="${esc(p.name)}">Ask about ${esc(p.name)}</button><button class="btn" data-act="projects">All projects</button></div></div>`,
    mount: w => { const c = $('canvas', w.el); if (c) drawQR(c); $('[data-ask]', w.el).onclick = () => openMail(`About ${p.name}`); } });
}
function openResume() {
  const sec = (t, html) => `<h4>${t}</h4>${html}`;
  return createWin({ id: 'resume', app: 'preview', title: 'David Résumé.pdf', w: 640, h: 640,
    body: `<div class="paper"><h1>${esc(OWNER.name)}</h1><div class="role">${esc(OWNER.role)}</div><p style="color:var(--text-2);max-width:60ch;margin:0">${esc(OWNER.bio)}</p>
      ${sec('Work experience', WORK.filter(w => w.kind === 'emp').map(w => `<div class="cv-row"><div class="yr">${esc(w.years)}</div><div><b>${esc(w.role)} · ${esc(w.org)}</b><span>${esc(w.body)}</span></div></div>`).join(''))}
      ${sec('Consultancy', WORK.filter(w => w.kind === 'con').map(w => `<div class="cv-row"><div class="yr">${esc(w.years)}</div><div><b>${esc(w.role)} · ${esc(w.org)}</b><span>${esc(w.body)}</span></div></div>`).join(''))}
      ${sec('Also worked with', `<p style="margin:0;color:var(--text-2)">${CLIENTS.map(esc).join(' · ')}</p>`)}
      ${sec('Training', TRAINING.map(([y, t, s]) => `<div class="cv-row"><div class="yr">${y}</div><div><b>${esc(t)}</b><span>${esc(s)}</span></div></div>`).join(''))}
      ${sec('Skills', `<div class="skills">${SKILLS.map(([k, v]) => `<div><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div>`)}
      ${sec('Languages', `<p style="margin:0">English, Kiswahili, Dholuo</p>`)}
      ${sec('Contact', `<p style="margin:0">${esc(OWNER.email)} · ${esc(OWNER.phone)} (phone & WhatsApp)</p>`)}</div>` });
}
function openMail(subject) {
  const subj = subject || 'Project enquiry';
  return createWin({ id: 'mail', app: 'mail', title: 'New Message', w: 580, h: 470,
    body: `<form class="mail" id="mailForm"><div class="row"><label>To:</label><span class="addr">${esc(OWNER.email)}</span><button type="button" class="btn" id="copyAddr" style="height:24px;padding:0 10px;font-size:12px">Copy</button></div><div class="row"><label>Phone:</label><span class="addr">${esc(OWNER.phone)}</span><a class="btn" href="${OWNER.whatsapp}" target="_blank" rel="noopener" style="height:24px;padding:0 10px;font-size:12px">WhatsApp</a></div><div class="row"><label for="mailSubj">Subject:</label><input id="mailSubj" value="${esc(subj)}"></div><textarea id="mailBody" aria-label="Message">Hi David,\n\n</textarea><div class="foot"><div class="links note">Usually replies within a day</div><a class="btn primary" id="mailSend" href="#">Open in Mail</a></div></form>`,
    update: w => { if (subject) { $('#mailSubj', w.el).value = subject; w.sync(); } },
    mount: w => {
      const f = $('#mailForm', w.el), send = $('#mailSend', w.el);
      w.sync = () => send.href = `mailto:${OWNER.email}?subject=${encodeURIComponent($('#mailSubj', w.el).value)}&body=${encodeURIComponent($('#mailBody', w.el).value)}`;
      f.oninput = w.sync; f.onsubmit = e => e.preventDefault(); w.sync();
      $('#copyAddr', w.el).onclick = e => { navigator.clipboard?.writeText(OWNER.email).then(() => e.target.textContent = 'Copied', () => toast('Select the address to copy it.')); };
    } });
}
function openTerminal() {
  return createWin({ id: 'terminal', app: 'terminal', title: 'guest — zsh — 80×24', w: 640, h: 420, cls: 'term-win',
    body: `<div class="term" id="term"><div class="ln m">Last login: ${new Date().toDateString()} on ttys001</div><div class="ln">Welcome to ${esc(OWNER.studio)}. Type <span class="d">help</span> to see what you can do.</div><div class="in"><span class="p">guest@ogis ~ %</span><input id="termIn" aria-label="Terminal input" autocomplete="off" spellcheck="false"></div></div>`,
    mount: w => {
      const term = $('#term', w.el), input = $('#termIn', w.el), line = $('.in', term), hist = []; let hi = 0;
      const out = (html, cls = '') => { const d = document.createElement('div'); d.className = 'ln ' + cls; d.innerHTML = html; term.insertBefore(d, line); };
      const CMDS = {
        help: () => out('<span class="d">whoami</span>      about David\n<span class="d">services</span>    what I offer\n<span class="d">projects</span>    things I have built\n<span class="d">career</span>      where I have worked\n<span class="d">skills</span>      languages, frameworks, tools\n<span class="d">ls</span> [folder]   list a folder\n<span class="d">open</span> name   open anything by name\n<span class="d">contact</span>     how to reach me\n<span class="d">date</span>, <span class="d">clear</span>, <span class="d">neofetch</span>, <span class="d">exit</span>'),
        whoami: () => out(`${esc(OWNER.name)} · ${esc(OWNER.studio)}\n${esc(OWNER.role)}, ${esc(OWNER.city)}`),
        services: () => out(SERVICES.map(s => `<span class="d">${s.name.padEnd(22)}</span>${esc(s.tagline)}`).join('\n')),
        projects: () => out(PROJECTS.map(p => `<span class="d">${p.name.padEnd(18)}</span>${esc(p.kind)}`).join('\n')),
        career: () => out(WORK.map(x => `<span class="m">${x.years.padEnd(16)}</span>${esc(x.role)} · ${esc(x.org)}`).join('\n')),
        skills: () => out(SKILLS.map(([k, v]) => `<span class="d">${k.padEnd(13)}</span>${esc(v)}`).join('\n')),
        ls: a => { const f = Object.keys(FOLDERS).find(k => k.toLowerCase() === (a || '').toLowerCase());
          out(f ? FOLDERS[f].map(it => esc(it.name)).join('\n') : Object.keys(FOLDERS).filter(k => k !== 'Trash').map(k => `<span class="d">${k.replace(' ', '\\ ')}/</span>`).join('   ') + '   David\\ Résumé.pdf'); },
        open: a => { if (!a) return out('usage: open name');
          const hit = searchIndex(a)[0]; if (!hit) return out(`open: ${esc(a)}: no such file or app`); hit.run(); out(`Opened ${esc(hit.label)}`, 'm'); },
        contact: () => out(`email      ${esc(OWNER.email)}\nphone      ${esc(OWNER.phone)}\nwhatsapp   ${esc(OWNER.whatsapp)}`),
        date: () => out(new Date().toString()),
        clear: () => term.querySelectorAll('.ln').forEach(n => n.remove()),
        neofetch: () => out(`<span class="d">   ~~~   </span> guest@ogis\n<span class="d"> ~~~~~~~ </span> OS: Ogis Creatives Portfolio 26.1\n<span class="d">~~~~~~~~~</span> Services: ${SERVICES.length}  Projects: ${PROJECTS.length}\n<span class="d"> ~~~~~~~ </span> Organisations: ${WORK.length + CLIENTS.length}\n<span class="d">   ~~~   </span> Languages: English, Kiswahili, Dholuo`),
        sudo: () => out('Nice try. Ask David for admin rights.'),
        exit: () => closeWin(w)
      };
      input.onkeydown = e => {
        if (e.key === 'ArrowUp' && hist.length) { hi = Math.max(0, hi - 1); input.value = hist[hi]; e.preventDefault(); }
        if (e.key === 'ArrowDown' && hist.length) { hi = Math.min(hist.length, hi + 1); input.value = hist[hi] || ''; }
        if (e.key !== 'Enter') return;
        const raw = input.value.trim(); input.value = '';
        out(`<span class="p">guest@ogis ~ %</span> ${esc(raw)}`);
        if (raw) { hist.push(raw); hi = hist.length; const [c, ...rest] = raw.split(/\s+/); (CMDS[c.toLowerCase()] || (() => out(`zsh: command not found: ${esc(c)}`)))(rest.join(' ')); }
        term.scrollTop = term.scrollHeight;
      };
      term.onclick = () => input.focus(); setTimeout(() => input.focus(), 50);
    } });
}

/* ---------- Desktop icons ---------- */
const DESKTOP = [
  { type: 'folder', name: 'Services' }, { type: 'folder', name: 'Projects' }, { type: 'folder', name: 'Career' }, { type: 'folder', name: 'NGO Work' },
  { type: 'pdf', name: 'David Résumé.pdf' }, { type: 'app', icon: 'about', name: 'About David' }, { type: 'app', icon: 'mail', name: 'Contact' },
  { type: 'app', icon: 'site', name: 'About This Site' }
];
function renderIcons() {
  const box = $('#icons');
  box.innerHTML = DESKTOP.map((it, i) => `<button class="dicon" data-i="${i}"><div class="img">${iconFor(it)}</div><span>${esc(it.name)}</span></button>`).join('');
  box.querySelectorAll('.dicon').forEach(b => {
    const it = DESKTOP[+b.dataset.i];
    b.onclick = e => { e.stopPropagation(); box.querySelectorAll('.dicon').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); if (coarse()) openItem(it); };
    b.ondblclick = () => openItem(it);
    b.onkeydown = e => { if (e.key === 'Enter') openItem(it); };
  });
}
document.addEventListener('pointerdown', e => { if (!e.target.closest('.dicon')) document.querySelectorAll('.dicon.sel').forEach(x => x.classList.remove('sel')); });

/* ---------- Dock ---------- */
function renderDock() {
  const dock = $('#dock');
  if (!dock.children.length) {
    dock.innerHTML = DOCK.map(k => k === '|' ? '<div class="dock-sep"></div>' : `<button class="dock-item" data-app="${k}" aria-label="${APPS[k].name}">${appIcon(k)}<span class="tip">${APPS[k].name}</span></button>`).join('');
    dock.querySelectorAll('.dock-item').forEach(b => b.onclick = () => {
      const k = b.dataset.app, mine = [...WINS.values()].filter(w => w.app === k);
      const minimized = mine.find(w => w.min);
      if (minimized) { restoreWin(minimized); focusWin(minimized); }
      else if (mine.length) focusWin(mine.sort((a, b) => b.el.style.zIndex - a.el.style.zIndex)[0]);
      else APPS[k].open();
      renderDock();
    });
    const items = [...dock.querySelectorAll('.dock-item')], base = 54, max = 82;
    dock.addEventListener('pointermove', e => {
      if (isPhone() || e.pointerType !== 'mouse') return;
      items.forEach(it => { const r = it.getBoundingClientRect(), d = Math.abs(e.clientX - (r.left + r.width / 2)), s = base + (max - base) * Math.max(0, 1 - d / 150) ** 2;
        it.style.width = it.style.height = s + 'px'; });
    });
    dock.addEventListener('pointerleave', () => items.forEach(it => it.style.width = it.style.height = ''));
  }
  const running = new Set([...WINS.values()].map(w => w.app));
  dock.querySelectorAll('.dock-item').forEach(b => b.classList.toggle('running', running.has(b.dataset.app) && b.dataset.app !== 'trash'));
}
function bounce(app) {
  renderDock();
  const b = $(`.dock-item[data-app="${app}"]`); if (!b || b.classList.contains('running-once')) return;
  b.classList.add('bounce', 'running-once'); setTimeout(() => b.classList.remove('bounce'), 1100);
}

/* ---------- Menu bar ---------- */
const appNameEl = $('#appName');
function setAppName(n) { appNameEl.textContent = n; }
$('.mb-logo').innerHTML = SVG.logo; $('#mbSearch').innerHTML = SVG.search; $('#mbWifi').innerHTML = SVG.wifi; $('#mbBattery').innerHTML = SVG.battery;
document.querySelector('[data-menu="view"]').textContent = 'Services';
document.querySelector('[data-menu="file"]').textContent = 'Projects';
const focused = () => topWin();
const MENUS = {
  logo: () => [['About This Site', '', openSite], '-', ['Change Wallpaper', '', cycleWall], ['Spotlight Search', '⌘K', openSpot], '-', ['Lock Screen', '⌃⌘Q', lock]],
  app: () => [[`About ${appNameEl.textContent}`, '', openSite], '-', ['Hide Others', '⌥⌘H', null], [`Quit ${appNameEl.textContent}`, '⌘Q', () => { const a = focused()?.app; [...WINS.values()].filter(w => w.app === a).forEach(closeWin); }]],
  file: () => [...PROJECTS.map(p => [p.name, '', () => openProject(p)]), '-', ['All Projects', '', () => openFinder('Projects')]],
  view: () => [...SERVICES.map(s => [s.name, '', () => openServices(s.id)]), '-', ['Request a Service…', '', () => openMail('Service enquiry')]],
  go: () => [['Services', '', () => openFinder('Services')], ['Projects', '', () => openFinder('Projects')], ['Career', '', () => openFinder('Career')], ['NGO Work', '', () => openFinder('NGO Work')], '-', ['Résumé', '', openResume], ['Terminal', '', openTerminal]],
  window: () => [['Minimize', '⌘M', () => focused() && minimizeWin(focused())], ['Zoom', '', () => focused() && zoomWin(focused())], '-',
    ...([...WINS.values()].map(w => [w.title, '', () => { restoreWin(w); focusWin(w); }])), ...(WINS.size ? [] : [['No Windows', '', null]])],
  help: () => [['How This Site Works', '', openSite], ['Terminal Commands', '', openTerminal], ['Contact David', '', () => openMail()]]
};
let openMenuEl = null, openMenuBtn = null;
function closeMenu() { openMenuEl?.remove(); openMenuEl = null; openMenuBtn?.classList.remove('open'); openMenuBtn = null; }
function showMenu(btn, items, at) {
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  items.forEach(it => {
    if (it === '-') return m.appendChild(document.createElement('hr'));
    const b = document.createElement('button'); b.innerHTML = `<span>${esc(it[0])}</span>${it[1] ? `<kbd>${it[1]}</kbd>` : ''}`;
    b.disabled = !it[2]; b.onclick = () => { closeMenu(); it[2](); }; m.appendChild(b);
  });
  document.body.appendChild(m);
  const r = at || btn.getBoundingClientRect(), x = Math.min(r.left, innerWidth - m.offsetWidth - 8);
  m.style.left = Math.max(8, x) + 'px'; m.style.top = (at ? r.top : r.bottom + 4) + 'px';
  openMenuEl = m; if (btn) { openMenuBtn = btn; btn.classList.add('open'); }
}
document.querySelectorAll('[data-menu]').forEach(b => {
  b.onclick = e => { e.stopPropagation(); if (openMenuBtn === b) return closeMenu(); showMenu(b, MENUS[b.dataset.menu]()); };
  b.onmouseenter = () => { if (openMenuBtn && openMenuBtn !== b) showMenu(b, MENUS[b.dataset.menu]()); };
});
document.addEventListener('pointerdown', e => { if (openMenuEl && !e.target.closest('.menu,[data-menu]')) closeMenu(); });
document.addEventListener('contextmenu', e => {
  if (e.target.closest('.win,.dock,.menubar,.menu')) return;
  e.preventDefault();
  showMenu(null, [['New Finder Window', '', () => openFinder('Projects')], '-', ['Change Wallpaper', '', cycleWall], ['Open Terminal', '', openTerminal], '-', ['Get Info', '', openSite], ['Lock Screen', '', lock]], { left: e.clientX, top: e.clientY });
});

/* ---------- Wallpaper ---------- */
const WALLS = ['', 'dusk', 'lake', 'night'];
let wallIdx = 0;
function cycleWall() { wallIdx = (wallIdx + 1) % WALLS.length; $('#wall').dataset.v = WALLS[wallIdx]; try { localStorage.setItem('ogis-wall', wallIdx); } catch (e) {} }
try { wallIdx = +(localStorage.getItem('ogis-wall') || 0) % WALLS.length; $('#wall').dataset.v = WALLS[wallIdx]; } catch (e) {}

/* ---------- Spotlight ---------- */
function searchIndex(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const all = [
    ...Object.keys(APPS).filter(k => APPS[k].open).map(k => ({ label: APPS[k].name, sub: 'Application', icon: appIcon(k), run: APPS[k].open })),
    ...['Services', 'Projects', 'Career', 'NGO Work'].map(f => ({ label: f, sub: 'Folder', icon: iconFor({ type: 'folder', name: f }), run: () => openFinder(f) })),
    ...SERVICES.map(s => ({ label: s.name, sub: 'Service', icon: appIcon(s.icon), run: () => openServices(s.id) })),
    ...PROJECTS.map(p => ({ label: p.name, sub: 'Project', icon: projIcon(p), run: () => openProject(p) })),
    ...WORK.map((w, i) => ({ label: w.org, sub: w.role, icon: orgDot(w), run: () => openCareer(i) })),
    { label: 'David Résumé.pdf', sub: 'Document', icon: SVG.pdf, run: openResume }
  ];
  return all.filter(r => r.label.toLowerCase().includes(q) || r.sub.toLowerCase().includes(q))
    .sort((a, b) => a.label.toLowerCase().indexOf(q) - b.label.toLowerCase().indexOf(q)).slice(0, 8);
}
let spotEl = null;
function closeSpot() { spotEl?.remove(); spotEl = null; }
function openSpot() {
  if (spotEl) return closeSpot();
  closeMenu();
  spotEl = document.createElement('div'); spotEl.className = 'spot';
  spotEl.innerHTML = `<div class="bar">${SVG.search}<input id="spotIn" placeholder="Search services, projects, places…" aria-label="Spotlight Search" autocomplete="off"></div><ul></ul>`;
  document.body.appendChild(spotEl);
  const input = $('input', spotEl), ul = $('ul', spotEl); let res = [], sel = 0;
  const draw = () => { ul.innerHTML = res.map((r, i) => `<li data-i="${i}" class="${i === sel ? 'on' : ''}"><span class="ic">${r.icon}</span><span>${esc(r.label)}</span><small>${esc(r.sub)}</small></li>`).join('');
    ul.querySelectorAll('li').forEach(li => li.onclick = () => { closeSpot(); res[+li.dataset.i].run(); }); };
  input.oninput = () => { res = searchIndex(input.value); sel = 0; draw(); };
  input.onkeydown = e => {
    if (e.key === 'ArrowDown') { sel = Math.min(res.length - 1, sel + 1); draw(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
    if (e.key === 'Enter' && res[sel]) { const r = res[sel]; closeSpot(); r.run(); }
  };
  setTimeout(() => input.focus(), 0);
}
$('#mbSearch').onclick = e => { e.stopPropagation(); openSpot(); };
document.addEventListener('pointerdown', e => { if (spotEl && !e.target.closest('.spot,#mbSearch')) closeSpot(); });

function toast(msg) {
  const t = document.createElement('div'); t.className = 'spot'; t.style.cssText = 'top:auto;bottom:110px;width:auto;padding:12px 20px;border-radius:999px;font-weight:500';
  t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* ---------- Actions, clock, lock ---------- */
const ACTIONS = { projects: () => openFinder('Projects'), services: () => openServices('support'), career: () => openCareer(0), about: openAbout, mail: () => openMail(), resume: openResume, wallpaper: cycleWall, lock: () => lock() };
document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a) ACTIONS[a.dataset.act]?.(); });

function tick() {
  const d = new Date();
  $('#clock').textContent = `${d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}  ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
  $('#ltime').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/i, '');
  $('#ldate').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
tick(); setInterval(tick, 10000);

const lockEl = $('#lock');
$('#lockAvatar').textContent = OWNER.initials; $('#lockName').textContent = `${OWNER.name} · ${OWNER.studio}`;
$('#lock .hint').textContent = 'Tech support · Development · NGO software · Click to enter';
function unlock() {
  if (!document.body.classList.contains('locked')) return;
  document.body.classList.remove('locked'); lockEl.classList.add('gone');
  if (!WINS.size && !unlock.done) { unlock.done = true; setTimeout(() => { if (!isPhone()) { openServices('support'); openAbout(); } }, 450); }
}
function lock() { closeMenu(); closeSpot(); document.body.classList.add('locked'); lockEl.classList.remove('gone'); setTimeout(() => lockEl.focus(), 50); }
lockEl.onclick = unlock;
document.addEventListener('keydown', e => {
  if (document.body.classList.contains('locked')) { unlock(); e.preventDefault(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSpot(); }
  if (e.key === 'Escape') { closeMenu(); closeSpot(); }
});

document.body.classList.add('locked');
renderIcons(); renderDock();
</script>
